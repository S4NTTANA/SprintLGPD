<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ford</title>    
    <link href="css/reset.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/form.css" rel="stylesheet">
    <script src="js/form.js"></script>
</head>
<body>
    <header>       
        <div>
            <img src="img/logo-ford-256.png" width="150" class="logo" />
        </div>
        <nav>
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <a href="lancamento.html">Lançamento</a>
                </li>
                <li>
                    <a href="contato.html">Contato</a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="forms">
            <div>
                <img src="img/xls 2.2 diesel.jpg">
            </div>
            <div>
                <h2 class="titulo">Sobre Você</h2>
                <form onsubmit="Post(this);" style="display: flex; flex-direction: column; align-items: center;">
                    
                    <input type="text" name="nome" placeholder="NOME*" class="fordform" required>
                    <input type="text" name="email" placeholder="E-MAIL*" class="fordform" required>
                    <input type="text" name="cpf" placeholder="CPF*" class="fordform" required>
                    <input type="text" name="sobrenome" placeholder="SOBRENOME*" class="fordform" required>
                    <input type="text" name="telefone" placeholder="TELEFONE*" class="fordform" required>
                    
                    <select name="contato" class="fordform" required>
                        <option selected disabled value="">COMO DESEJA SER CONTATADO</option>
                        <option>TELEFONE</option>
                        <option>E-MAIL</option>
                    </select>

                    <div class="lgpd-container" style="max-width: 370px; width: 100%; text-align: left; margin: 15px 0; font-size: 13px; color: #666; line-height: 1.5; box-sizing: border-box; padding: 0 5px;">
                        <p style="margin-bottom: 12px;">
                            Os dados serão mantidos em nossa base de dados, só enquanto for desejado por você. A qualquer momento, será possível editar ou remover tais dados.
                        </p>
                        
                        <div style="margin-bottom: 8px; display: flex; align-items: flex-start; gap: 8px;">
                            <input type="checkbox" id="chkTermos" name="termos" style="margin-top: 3px; cursor: pointer;">
                            <label for="chkTermos" style="cursor: pointer;">
                                Sim. Li e concordo com os <a href="https://www.ford.com.br/politica-de-privacidade/" target="_blank" style="color: #0056b3; text-decoration: underline;">Termos e Condições</a>.
                            </label>
                        </div>
                        
                        <div style="display: flex; align-items: flex-start; gap: 8px; margin-bottom: 5px;">
                            <input type="checkbox" id="chkNovidades" name="novidades" style="margin-top: 3px; cursor: pointer;">
                            <label for="chkNovidades" style="cursor: pointer;">
                                Sim. Também quero receber descontos e novidades.
                            </label>
                        </div>
                    </div>
                    <button type="submit" id="btnEnviar" disabled>Enviar</button>
                </form>
            </div>
        </div>
    </main>
    <footer>
        <nav id="social">
            <ul>
                <li><span class="redesociais">Redes Sociais</span></li>
                <li><a href="#" title="Facebook"><img src="img/facebook-50.png"></a></li>
                <li><a href="#" title="YouTube"><img src="img/youtube-squared-50.png"></a></li>
                <li><a href="#" title="Instagram"><img src="img/instagram-logo-50.png"></a></li>
            </ul>
        </nav>
        <div>
           <img src="img/ford-96.png" width="70"  />
        </div>
    </footer>    
</body>
</html>
